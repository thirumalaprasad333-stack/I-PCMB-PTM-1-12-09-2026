function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function showResult(){
 const mobile=document.getElementById('mobile').value.replace(/\D/g,'');
 const s=students.find(x=>x.mobile===mobile);
 const out=document.getElementById('result'), err=document.getElementById('error');
 if(!s){out.style.display='none';err.style.display='block';return;}
 err.style.display='none';
 let html=`<div class="student"><h2>${esc(s.name)}</h2><div class="details"><span class="pill">Register No: ${esc(s.regNo)}</span><span class="pill">Mobile: ${esc(s.mobile)}</span></div></div>`;
 ['PHYSICS','CHEMISTRY','MATHEMATICS','BIOLOGY'].forEach(sub=>{
   if(!s[sub])return;
   html+=`<div class="subject"><h3>${sub}</h3><table><tr><th>Test</th><th>Date</th><th>Maximum</th><th>Marks Obtained</th></tr>`;
   s[sub].forEach(m=>html+=`<tr><td>${esc(m.test||'-')}</td><td>${esc(m.date||'-')}</td><td>${esc(m.max||'-')}</td><td><b>${esc(m.marks)}</b></td></tr>`);
   html+='</table></div>';
 });
 out.innerHTML=html;out.style.display='block';out.scrollIntoView({behavior:'smooth',block:'start'});
}
document.getElementById('mobile').addEventListener('keydown',e=>{if(e.key==='Enter')showResult();});
</script>
